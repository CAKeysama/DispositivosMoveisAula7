name: Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Generate visual evidence
        run: flutter test tool/evidencias_test.dart --update-goldens

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-telas
          path: docs/evidencias/*.png

      - name: Build web app
        run: flutter build web

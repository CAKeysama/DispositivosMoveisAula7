name: Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source code
        run: |
          set +e
          output=$(flutter analyze 2>&1)
          status=$?
          printf '%s\n' "$output"
          {
            echo '### Resultado de `flutter analyze`'
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run widget tests
        run: flutter test

      - name: Generate visual evidence
        run: flutter test tool/evidencias_test.dart --update-goldens

      - name: Upload visual evidence
        uses: actions/upload-artifact@v5
        with:
          name: evidencias-telas
          path: docs/evidencias/*.png

      - name: Build web app
        run: flutter build web

      - name: Save visual evidence on the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidencias/*.png
          if git diff --cached --quiet; then
            echo "Visual evidence is already up to date."
          else
            git commit -m "docs: atualiza evidencias visuais [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
